services:
  # Next.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibed-to-cracked-app
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./prisma:/app/prisma
      - ./private:/app/private # add this
    networks:
      - app-network
    depends_on:
      - db

  # Database (PostgreSQL for production)
  db:
    image: postgres:17-alpine
    container_name: vibed-to-cracked-db
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-vibed_to_cracked}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Cron job runner (supercronic inside Docker, hits app over internal network)
  cron:
    build:
      context: .
      dockerfile: docker/cron/Dockerfile
    container_name: vibed-to-cracked-cron
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NEXTAUTH_URL=http://app:3000
      - CRON_LOG_FILE=/var/log/cron-jobs/cron.log
    volumes:
      - cron_logs:/var/log/cron-jobs
    networks:
      - app-network
    depends_on:
      - app
      - db

volumes:
  postgres_data:
  cron_logs:

networks:
  app-network:
    driver: bridge
