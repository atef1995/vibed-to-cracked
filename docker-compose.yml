services:
  # Next.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibed-to-cracked-app
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./prisma:/app/prisma
      - ./private:/app/private
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)throw r.status;process.exit(0)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    depends_on:
      - db

  # Database (PostgreSQL for production)
  db:
    image: postgres:17-alpine
    container_name: vibed-to-cracked-db
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-vibed_to_cracked}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Cron job runner (supercronic inside Docker, hits app over internal network)
  cron:
    build:
      context: .
      dockerfile: docker/cron/Dockerfile
    container_name: vibed-to-cracked-cron
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NEXTAUTH_URL=http://app:3000
      - CRON_LOG_FILE=/var/log/cron-jobs/cron.log
    volumes:
      - cron_logs:/var/log/cron-jobs
    networks:
      - app-network
    depends_on:
      - app
      - db

  # One-off seed runner: docker compose run --rm seed <script>
  # Example: docker compose run --rm seed scripts/dbSeeds/seeds/exercises/seedExercises.ts
  seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    container_name: vibed-to-cracked-seed
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./scripts:/app/scripts
      - ./prisma:/app/prisma
    networks:
      - app-network
    depends_on:
      - db
    profiles:
      - seed

volumes:
  postgres_data:
  cron_logs:

networks:
  app-network:
    driver: bridge
